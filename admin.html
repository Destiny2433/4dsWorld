<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | 4D'S World</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .admin-page-wrap {
            padding-top: calc(var(--nav-height) + 40px);
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* Login panel box */
        .admin-login-box {
            max-width: 420px;
            margin: 80px auto;
            padding: 40px;
        }

        /* Dashboard Tabs */
        .admin-tabs-nav {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .admin-tab-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 10px 20px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: var(--transition-fast);
        }

        .admin-tab-btn.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(212, 168, 83, 0.05);
        }

        .admin-tab-content {
            display: none;
        }

        .admin-tab-content.active {
            display: block;
        }

        /* Tables styling */
        .admin-table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--bg-secondary);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            text-align: left;
        }

        .admin-table th, .admin-table td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            white-space: nowrap;
        }

        .admin-table th {
            font-family: var(--font-heading);
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-gold);
            background: rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        .admin-table tr:hover td {
            background: rgba(255,255,255,0.01);
        }

        /* Order status badges */
        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-badge.pending {
            background: rgba(255, 183, 3, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-badge.paid {
            background: rgba(46, 196, 182, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-box {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            border-color: var(--accent-gold);
            transform: scale(0.9);
            transition: var(--transition-smooth);
        }

        .modal-overlay.active .modal-content-box {
            transform: scale(1);
        }

        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .modal-close-btn:hover {
            color: var(--error);
        }

        .form-group-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 18px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">4D'S <span>WORLD</span></a>
            
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="shop.html" class="nav-link">Shop</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>

            <div class="nav-actions">
                <button class="btn btn-secondary" id="admin-logout-btn" style="display: none; padding: 8px 16px; font-size: 0.8rem;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                <div class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Page Body Wrapper -->
    <main class="admin-page-wrap">
        <div class="container">
            
            <!-- 1. LOGIN AREA -->
            <section class="admin-login-box glass-panel" id="login-section">
                <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;"><i class="fas fa-lock" style="color: var(--accent-gold); margin-right: 8px;"></i> Security Login</h2>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label for="admin-pass">Access Password</label>
                        <input type="password" id="admin-pass" class="form-control" placeholder="Enter Admin Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;"><i class="fas fa-sign-in-alt"></i> Authenticate</button>
                </form>
            </section>

            <!-- 2. DASHBOARD AREA (Hidden by default) -->
            <section id="dashboard-section" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;">
                    <div>
                        <h1 style="font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Admin <span>Dashboard</span></h1>
                        <p style="color: var(--text-secondary);">Manage your shop products and track client orders.</p>
                    </div>
                    
                    <button class="btn btn-primary" id="btn-open-add-modal"><i class="fas fa-plus"></i> Add New Product</button>
                </div>

                <!-- Tabs navigation -->
                <div class="admin-tabs-nav">
                    <button class="admin-tab-btn active" data-tab="products">Products List</button>
                    <button class="admin-tab-btn" data-tab="orders">Orders Log</button>
                </div>

                <!-- Tabs container views -->
                <div class="admin-tabs-content-container">
                    
                    <!-- Products Tab -->
                    <div class="admin-tab-content active" id="tab-products">
                        <div class="admin-table-container">
                            <table class="admin-table" id="admin-products-table">
                                <thead>
                                    <tr>
                                        <th>Code ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Retail (₦)</th>
                                        <th>Wholesale (₦)</th>
                                        <th>Wholesale Qty</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Orders Tab -->
                    <div class="admin-tab-content" id="tab-orders">
                        <div class="admin-table-container">
                            <table class="admin-table" id="admin-orders-table">
                                <thead>
                                    <tr>
                                        <th>Ref</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                        <th>Customer</th>
                                        <th>Phone</th>
                                        <th>Delivery Address</th>
                                        <th>Items Purchased</th>
                                        <th>Total Paid (₦)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <!-- Modal Form overlay for Add/Edit products -->
    <div class="modal-overlay" id="product-modal-overlay">
        <div class="modal-content-box glass-panel">
            <span class="modal-close-btn" id="btn-close-modal"><i class="fas fa-times"></i></span>
            <h2 id="modal-form-title" style="font-family: var(--font-heading); margin-bottom: 25px; color: var(--accent-gold); text-transform: uppercase;">Add New Product</h2>
            
            <form id="product-crud-form">
                <!-- Action check -->
                <input type="hidden" id="form-action" value="add">
                
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="form-prod-id">Product Code ID</label>
                        <input type="text" id="form-prod-id" class="form-control" placeholder="e.g. c6, s6, b6" required>
                    </div>
                    <div class="form-group">
                        <label for="form-prod-name">Product Name</label>
                        <input type="text" id="form-prod-name" class="form-control" placeholder="e.g. Designer Jacket" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="form-prod-category">Category</label>
                        <select id="form-prod-category" class="form-control" required style="background: var(--bg-primary);">
                            <option value="clothes">Clothes</option>
                            <option value="shoes">Shoes</option>
                            <option value="bags">Bags</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-prod-badge">Badge Banner</label>
                        <input type="text" id="form-prod-badge" class="form-control" placeholder="e.g. New, Trending, Sale">
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="form-prod-price">Retail Price (₦)</label>
                        <input type="number" id="form-prod-price" class="form-control" placeholder="e.g. 25000" required>
                    </div>
                    <div class="form-group">
                        <label for="form-prod-wprice">Wholesale Price (₦)</label>
                        <input type="number" id="form-prod-wprice" class="form-control" placeholder="e.g. 18000" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="form-prod-wqty">Wholesale Min Qty</label>
                        <input type="number" id="form-prod-wqty" class="form-control" value="5" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="form-prod-sizes">Sizes (Comma separated)</label>
                        <input type="text" id="form-prod-sizes" class="form-control" placeholder="e.g. S,M,L or 40,41,42" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-prod-colors">Colors (Comma separated)</label>
                    <input type="text" id="form-prod-colors" class="form-control" placeholder="e.g. Black,Blue,White" required>
                </div>

                <div class="form-group">
                    <label for="form-prod-image">Image URL</label>
                    <input type="url" id="form-prod-image" class="form-control" placeholder="https://images.unsplash.com/..." required>
                </div>

                <div class="form-group">
                    <label for="form-prod-desc">Description</label>
                    <textarea id="form-prod-desc" class="form-control" placeholder="Enter product descriptions detail..." required style="min-height: 80px;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;"><i class="fas fa-save"></i> Save Product Changes</button>
            </form>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
